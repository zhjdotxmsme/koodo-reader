# name: Build/release-android
#
# 构建可安装的安卓 APK(自签名 debug)。
#
# 只用**官方 actions**(checkout / setup-node / setup-java / upload-artifact),
# 不依赖任何第三方 action 仓库(避免 "Unable to resolve action ... repository not found"):
#   - Android SDK 来自 runner 预装(GitHub ubuntu 镜像自带 Android SDK + cmdline-tools),
#     缺组件时用官方 cmdline-tools 的 sdkmanager 补齐(platforms;android-34 / build-tools;34.0.0)
#   - Gradle 8.5 直接下官方发行版(services.gradle.org)
#   - GitHub Release 用 runner 预装的 `gh` CLI
#
# 用法:
#   - GitHub UI: Actions 标签页 -> "Build/release-android" -> Run workflow
#   - tag: git tag v2.4.4 && git push origin v2.4.4(APK 会附到该 Release)
#
# 产物: android/app/build/outputs/apk/<abi>/app-debug-<abi>.apk(默认 arm64-v8a + armeabi-v7a)

name: Build/release-android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  android-apk:
    name: Build installable debug APKs (arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-22.04
    env:
      ANDROID_API_LEVEL: 34

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Redirect git+ssh dependency fetches to HTTPS (GHA has no SSH key)
        shell: bash
        run: |
          # yarn.lock holds transitive git deps (e.g. @electron/node-gyp,
          # register-scheme) as git+ssh://; yarn 1 fetches them via `git`,
          # which fails without an SSH key on GHA. Rewrite to HTTPS.
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global --list | grep -i insteadof || true

      - name: Install dependencies (skip native postinstall; the web build needs no native module)
        run: yarn install --ignore-scripts

      - name: TypeScript type check
        run: npx tsc --noEmit --noUnusedLocals false --noUnusedParameters false

      - name: Run Android build core tests
        env:
          CI: true
        run: npx react-scripts test --watchAll=false --testPathPattern "androidBuild"

      - name: Check CFI golden vectors match upstream (native engine guard)
        run: node scripts/gen-cfi-golden.js --check

      - name: Check Room entities match schema.lock (native data-layer guard)
        run: node scripts/check-room-schema.js

      - name: Check import rules match desktop list + folderBridge subset (native import guard)
        run: node scripts/check-import-rules.js

      - name: Check desktop DDL constants match schema.lock (native -> desktop bridge guard)
        run: node scripts/check-dbio-ddl.js

      - name: Check bundled locales match src/assets/locales (i18n bridge guard)
        run: node scripts/sync-locales-android.js --check

      - name: Check TTS manifest wiring matches the feature module (P6 guard)
        run: node scripts/check-tts-manifest.js

      - name: Check OCR pre-download meta-data matches OcrScript (P6 guard)
        run: node scripts/check-ocr-manifest.js

      - name: Check every delivered P6 screen is reachable from :app (P6 guard)
        run: node scripts/check-p6-entries.js

      - name: Test the pdf.js engine core (native PDF reader bridge)
        run: node scripts/test-pdfengine.js

      - name: Build the web app
        env:
          GENERATE_SOURCEMAP: "false"
          # GHA sets CI=true which makes CRA treat lint warnings as errors;
          # this fork ships with warnings, so build with CI=false.
          CI: "false"
        run: yarn build

      - name: Ensure Android SDK 34 components
        shell: bash
        run: |
          set -e
          if [ -z "${ANDROID_HOME:-}" ] && [ -d /usr/local/lib/android/sdk ]; then
            ANDROID_HOME=/usr/local/lib/android/sdk
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is not set (expected to be preinstalled on the GitHub Ubuntu runner)"
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          SDK=""
          for d in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                   "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
                   "$ANDROID_HOME/tools/bin/sdkmanager"; do
            [ -x "$d" ] && { SDK="$d"; break; }
          done
          if [ -n "$SDK" ]; then
            yes | "$SDK" --licenses >/dev/null 2>&1 || true
            [ -d "$ANDROID_HOME/platforms/android-34" ] || "$SDK" "platforms;android-34" || true
            [ -d "$ANDROID_HOME/build-tools/34.0.0" ] || "$SDK" "build-tools;34.0.0" || true
          fi
          echo "--- installed components ---"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          [ -d "$ANDROID_HOME/platforms/android-34" ] || { echo "::error::platforms;android-34 is missing"; exit 1; }
          [ -d "$ANDROID_HOME/build-tools/34.0.0" ] || echo "::warning::build-tools;34.0.0 not found; AGP will use the installed build-tools"

      - name: Install Gradle 8.5 (official distribution)
        shell: bash
        run: |
          set -e
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          rm -rf /opt/gradle-8.5
          mkdir -p /opt
          # The distribution zip contains a top-level gradle-8.5/ directory,
          # so extracting to /opt yields /opt/gradle-8.5/bin/gradle.
          unzip -q /tmp/gradle.zip -d /opt
          test -x /opt/gradle-8.5/bin/gradle
          /opt/gradle-8.5/bin/gradle --version | grep -q "Gradle 8.5"
      - name: Activate Gradle (GITHUB_PATH applies to subsequent steps only)
        shell: bash
        run: echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"
      - name: Verify Gradle 8.5 is on PATH
        shell: bash
        run: |
          set -e
          command -v gradle
          gradle --version | head -4
          # Hard-fail if the runner-image Gradle (e.g. 9.7.1) shadows ours.
          gradle --version | grep -q "Gradle 8.5"

      - name: "Native unit tests — EVERY module (engine + core + feature + :app)"
        shell: bash
        run: |
          set -e
          cd android
          # The full matrix, not a hand-maintained list. The previous list named 8 modules
          # and silently skipped engine:annotate/link/toc/image/pdf, core:locale, all six
          # feature:* modules and :app itself — which is exactly where 46 failing tests
          # were hiding (docs/android-completeness-2026-09-24.md). Invoking the bare task
          # name runs `test` in every subproject that has it, so a new module is covered
          # the moment it is registered in settings.gradle.
          gradle test --no-daemon --console=plain

      - name: Verify all features are packaged, then build per-ABI debug APKs (self-signed, installable)
        run: node scripts/build-android.js --target webview,native --debug --abi arm64-v8a,armeabi-v7a --audit --verbose

      - name: "16 KB page-size guard (every .so inside every built APK)"
        shell: bash
        run: |
          set -e
          # Pure Node (scripts/check-elf-16kb.js reads the ZIP and the ELF program headers
          # itself): needs neither `unzip` nor `llvm-readelf`, so it runs on any runner.
          # Android 15+ rejects a .so whose PT_LOAD segments are not 16 KB aligned, and
          # Play requires it from 2025-11. The first .so in this APK arrived with
          # androidx.datastore (P6-TTS) — see docs/android-baseline-after.json.
          found=0
          while IFS= read -r -d '' apk; do
            found=1
            echo "== $apk"
            node scripts/check-elf-16kb.js "$apk"
          done < <(find android/app/build/outputs/apk -type f -name '*.apk' -print0)
          if [ "$found" = "0" ]; then
            echo "::error::no APK found to check for 16 KB alignment"
            exit 1
          fi

      - name: Collect APK artifacts
        shell: bash
        run: |
          set -e
          mkdir -p out
          find android/app/build/outputs/apk -type f -name "*.apk" -print0 \
            | while IFS= read -r -d '' f; do cp "$f" out/; done
          ls -lh out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: koodo-reader-android
          path: out
          if-no-files-found: error
          retention-days: 30

      - name: Attach APKs to the GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete "$GITHUB_REF_NAME" --yes >/dev/null 2>&1 || true
          gh release create "$GITHUB_REF_NAME" \
            --title "Koodo Reader $GITHUB_REF_NAME (Android)" \
            --notes "Koodo Reader Android — self-signed debug APKs, dual-track (docs/android-native-migration.md): *-native*.apk = P1 native shell (bookshelf, SAF import, desktop .db backup bridge); the plain .apk = WebView full-feature track. arm64-v8a + armeabi-v7a. Install directly on a device (allow unknown sources)." \
            out/*.apk
