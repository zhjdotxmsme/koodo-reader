// core/common — desktop-parity i18n + shared pure-JVM utilities.
//
// PURE KOTLIN JVM MODULE (same rationale as :core:importer/:core:dbio).
// Translation catalogs are synced at build time from src/assets/locales
// (scripts/sync-locales-android.js) into the app assets; keys are IDENTICAL
// to the desktop react-i18next keys. Only the en + zh-CN subset is bundled
// (ADR-004).

plugins {
    id 'org.jetbrains.kotlin.jvm'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    // Test only — this module has zero runtime dependencies.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}
