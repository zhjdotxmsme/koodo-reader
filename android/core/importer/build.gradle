// core/importer — book-file import rules for the native Android client.
//
// PURE KOTLIN JVM MODULE (same rationale as :engine:cfi): the rules are
// dependency-free logic, so they are unit-tested on any JVM without the
// Android SDK. This module is the KOTLIN SINGLE SOURCE OF TRUTH declared by
// P1 ("SAF 导入（规则迁 Kotlin 为单一事实源）"). The WebView track still
// consumes the JS mirror src/utils/android/folderBridge.js (the web engine
// protocol needs it there); CI keeps the two in lock-step via
//   node scripts/check-import-rules.js
// until the WebView track retires (P8).
plugins {
    id 'org.jetbrains.kotlin.jvm'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    // Test only — this module has zero runtime dependencies.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    // `runBlocking` for the suspend pipeline API (JUnit 5 cannot invoke a
    // `suspend fun` test method, which silently skipped this whole class).
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// Opt-in mixed-format import scale harness (board card P1-IMPORT, JVM half).
//
// Not part of `test`: it imports the whole corpus twice (batch + per-book
// percentiles), which is minutes of CI for a number only a device comparison
// consumes. `node scripts/measure-import-jvm.js` drives it, parses the
// `IMPORT_SCALE_JSON=` line and records the result.
//
//   gradle -p android :core:importer:importScaleTest -PimportBooks=1000 -PimportHeap=256m
tasks.register('importScaleTest', Test) {
    description = 'Mixed-format import scale harness: 1000 books, bounded heap, JSON output.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'koodo.import.scale', 'true'
    systemProperty 'koodo.import.scale.n', (project.findProperty('importBooks') ?: '1000').toString()
    // A bounded heap is the point: the pass has to survive it, not merely finish.
    maxHeapSize = (project.findProperty('importHeap') ?: '256m').toString()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
        exceptionFormat 'full'
    }
}
