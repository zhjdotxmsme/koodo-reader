// engine/text — native TXT / MD engine (P5).
//
// PURE KOTLIN JVM MODULE: charset detection (chardet replacement), text
// normalisation, chapter segmentation and a dependency-free Markdown subset
// renderer. No Android dependency so the logic is unit-tested on the JVM.
//
// Reference: kookit `TxtRender` / `MdRender` + `textProcessor.ts`
// (docs/android-native-migration.md P5).

plugins {
    id 'org.jetbrains.kotlin.jvm'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    // The `ChapterLoader` interface the streaming text reader adapts to —
    // declared in :engine:layout (the incremental reading contract, T1):
    //   android/engine/layout/src/main/kotlin/com/koodoreader/engine/layout/reader/ChapterLoader.kt
    // engine:text does not otherwise use layout; this is the single cross-module
    // link required by T2.
    api project(':engine:layout')
    // Test only — :engine:layout already brings in JUnit via its own test
    // dependencies, but we declare it here explicitly so a future refactor of
    // :engine:layout's test setup never silently breaks this module's tests.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}
