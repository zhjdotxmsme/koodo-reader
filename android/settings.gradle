pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "KoodoReaderAndroid"
include ':app'
include ':core:data'
// Pure JVM import rules module (Kotlin single source of truth for the SAF /
// book-file import pipeline; see docs/android-native-migration.md P1).
include ':core:importer'

// Pure JVM desktop .db bridge (SQLite files + backup zip, both directions of
// "桌面 .db 双向可读" — see the P1 Room migration card).
include ':core:dbio'

// Pure JVM shared utilities: desktop-parity i18n (keys identical to the
// desktop react-i18next catalogs; locale subset synced by
// scripts/sync-locales-android.js, see ADR-004).
include ':core:common'

//

// Native reading-engine modules (Kotlin, no Android dependency) — see
// docs/android-native-migration.md. They are plain JVM modules so `gradle test`
// works without the Android SDK.
include ':engine:cfi'

// Native pagination (`自绘分页`): CSS-columns line breaking + page filling,
// consumed by the reader. Depends on :engine:cfi for CFI addressing (ADR-002).
include ':engine:layout'

// Native gesture / interaction core: fling physics, edge bounce, tap zones,
// reader mode state. Pure JVM, no Android dependency (same as :engine:cfi).
include ':engine:gesture'

// Native MOBI/AZW/AZW3 parser (P4): PalmDOC + HUFF/CDIC, MOBI6/KF8, EXTH.
include ':engine:mobi'

// Native TXT/MD engine (P5): charset detection + Markdown subset renderer.
include ':engine:text'

// Native reading enhancements (P6): paragraph mode, RSVP, ruler, bionic,
// text replacement rules, selection auto-turn.
include ':engine:feature'

// Native PDF reading core (P3, docs/android-native-migration.md §6): pdf.js
// in the engine WebView (Apache-2.0, zero .so; see docs/android-pdf-poc.md).
// Pure JVM module — outline / text search / password gate / Range→CFI
// mapping / snapshot exporter are all algorithm-only, unit-tested without
// the Android SDK. The Compose WebView host (engine/pdfhost) lives in :app.
include ':engine:pdf'

// ---------------------------------------------------------------------------
// P5.5 (FB2 / DOCX / HTML / MHTML) — PLANNED, NOT IMPLEMENTED.
//
// These four includes were committed by 0ccac028 from the P5-FB2 evaluation card's
// settings.gradle *template* (docs/patches/p5-fb2-settings-gradle.patch), but the
// module directories were never created: android/core/archive, android/engine/fb2,
// android/engine/htmlbook and android/engine/docx do not exist. Gradle tolerates
// that (they show up in `gradle projects` as empty projects with no tasks), which
// made 4 phantom modules look like delivered ones.
//
// Uncomment them together with the modules themselves, once the two hard
// prerequisites on the board are done: D0 (XHTML→TextBlock flattener) and R1
// (core/archive abstraction), then the P5.5 card(s).
//
// // Shared archive (zip) facade: ONE zip reader for EPUB / CBZ / DOCX (OOXML) /
// // desktop backup bundles — see docs/fb2-docx-html-mhtml-eval.md risk R1.
include ':core:archive'
// // Native FB2 (FictionBook 2) converter (P5.5a).
// include ':engine:fb2'
// // Native single-file HTML / MHTML converter (P5.5b/c).
// include ':engine:htmlbook'
// // Native DOCX (WordprocessingML subset) converter (P5.5d).
// include ':engine:docx'
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// P2 reading-engine modules — committed by the P2 card but never registered in
// this file, so they were dead code. Pure JVM (same trade-off as :engine:cfi).
// ---------------------------------------------------------------------------

// Highlights / notes / bookmarks: three-state model, CFI-only positions
// (ADR-002), column codec aligned with the desktop notes/bookmarks tables.
include ':engine:annotate'

// Image viewer / footnotes / in-book links: event model, footnote extraction,
// link classification + routing policy (mirrors NativeEventDispatcher.kt).
include ':engine:link'

// EPUB spine / TOC, reading position and full-text search.
include ':engine:toc'

// ---------------------------------------------------------------------------
// P5/P6/P8 modules delivered in isolated worktrees, integrated here.
// Provenance per card: docs/MERGE-PLAN-2026-09-24.html
// ---------------------------------------------------------------------------

// Native comic / image-sequence reader (P5): CBZ / CBT / image-directory
// unpacking, lazy page window, single/double-page layout, zoom-pan state.
// CB7 (7z) and CBR (rar) are skeletons — see docs/p5-image-engine-adr.md §4.
include ':engine:image'

// Simplified/Traditional Chinese conversion (native OpenCC port) + on-demand
// loading of the remaining locale packs (P6). Pure JVM; persistence is bound in
// :app through the ZhConvertSettingsStore port (docs/p6-zh-locale-design.md §4).
include ':core:locale'

// Reading statistics (P6), desktop /stats parity: aggregated metrics, reading
// time accounting, private `reading_sessions` database.
include ':feature:stats'

// On-device OCR (P6): ML Kit unbundled model packs + a searchable index of
// scanned pages. NOTE: the Play-services download adapter is BLOCKED and
// quarantined in the module's build.gradle (ML Kit options are not
// `OptionalModuleApi`) — see android/feature/ocr/build.gradle header, and
// docs/p6-stats-ocr-design.md §5 for the manifest meta-data still to be wired.
include ':feature:ocr'

// TTS (P6): engine enumeration, persisted rate/pitch/volume, MediaSession media
// keys, foreground-service keep-alive, reading-position resume.
// Host binding + manifest entries: docs/p6-tts-semantics-mapping.md §5.
include ':feature:tts'

// Selection translation (Google / Microsoft / DeepL) + AI assistant (P6).
// Owns the EncryptedSharedPreferences credential store and its Room history DB.
include ':feature:translate'

// Native MDX/MDD dictionary (P6). Shares the `OnDemandDownloader` contract with
// :feature:ocr — both declare it privately, so a single owner must be decided
// before :app depends on both (docs/p6-stats-ocr-design.md §5.4).
include ':feature:dictionary'

// Crash-monitoring core (P8): backend-free interfaces + redaction-only
// before-send hook. :app installs it from KoodoReaderApp.onCreate; that install
// call is host wiring and is not part of this integration.
include ':feature:crash'

// Macrobenchmark suite (P8): cold start / open EPUB / page turn / memory peak.
// `com.android.test` module targeting :app's `benchmark` build type; run via
// scripts/ci-macro-benchmark.sh on a device (docs/p8-rollout-checklist.md §5).
include ':benchmarks'
