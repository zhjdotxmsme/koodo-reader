pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "KoodoReaderAndroid"
include ':app'

// Native reading-engine modules (Kotlin, no Android dependency) — see
// docs/android-native-migration.md. They are plain JVM modules so `gradle test`
// works without the Android SDK.
include ':engine:cfi'
