<!doctype html>
<!--
  Foliate reflow engine bootstrap.

  Loaded into a visible WebView by FoliateHostBridge.bootstrap() over the
  loopback LocalAssetServer. Engine logic lives in ./engine.mjs (tested by
  scripts/test-foliate-host.js); this file wires foliate-view + the host shim.

  Protocol:
    window.__koodoFoliate.call(callId, method, args) -> Promise<any>
    window.__koodoFoliateHost.onResult(callId, payload, error)
    window.__koodoFoliateHost.onEvent(name, payload)
    window.__koodoFoliateHost.onLog(level, message)
    setViewSettings(opts) -> { ok: true }
-->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Koodo Foliate Engine</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff; }
        foliate-view { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
<script type="module">
import './view.js';
import { Overlayer } from './overlayer.js';
import { createFoliateEngine, dispatch } from './engine.mjs';

const host = window.__koodoFoliateHost || {
    onResult: function () {},
    onEvent: function () {},
    onLog: function (level, message) { console.log(level + ': ' + message); },
};

function log(level, message) {
    try { host.onLog(level, String(message)); } catch (e) {}
    if (level === 'error') console.error(message); else console.log(message);
}

const view = document.createElement('foliate-view');
document.body.append(view);
view.addEventListener('draw-annotation', (ev) => {
    const detail = (ev && ev.detail) || {};
    if (typeof detail.draw !== 'function') return;
    const color = (detail.annotation && detail.annotation.color) || '#ffe066';
    detail.draw(Overlayer.highlight, { color: color });
});
view.addEventListener('load', (ev) => {
    const doc = ev.detail && ev.detail.doc;
    if (!doc || doc.__koodoFootnote) return;
    doc.__koodoFootnote = true;
    doc.addEventListener('click', (e) => {
        const a = e.target && e.target.closest && e.target.closest('a');
        if (!a) return;
        const epubType = (a.getAttribute('epub:type') || a.getAttribute('type') || '').toLowerCase();
        const href = a.getAttribute('href') || '';
        if (epubType.indexOf('noteref') < 0 && epubType.indexOf('footnote') < 0) return;
        e.preventDefault();
        e.stopPropagation();
        const id = (href.split('#')[1] || '').trim();
        let excerpt = '';
        if (id) {
            const el = doc.getElementById(id) || doc.querySelector('[name="' + id + '"]');
            excerpt = el ? String(el.textContent || '').trim().slice(0, 800) : '';
        }
        try { host.onEvent('footnote', JSON.stringify({ href, excerpt })); } catch (err) {}
    }, true);
});

const engine = createFoliateEngine({ view, log, host });

window.__koodoFoliate = {
    call(callId, method, args) {
        return dispatch(engine, callId, method, args || [], host);
    },
};

log('info', 'foliate engine ready');
window.__koodoFoliateReady = true;
try { host.onEvent('ready', '{}'); } catch (e) {}
</script>
</body>
</html>
