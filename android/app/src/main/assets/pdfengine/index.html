<!doctype html>
<!--
  PDF engine bootstrap (docs/android-native-migration.md P3).

  Loaded into a dedicated, non-visible WebView by
  `PdfJsHostBridge.bootstrap()` over the loopback `LocalAssetServer`. All engine
  logic lives in ./engine.mjs (unit-tested by scripts/test-pdfengine.js); this
  file only wires pdf.js + the `window.__koodoPdfHost` shim to it.

  Protocol:
    window.__koodoPdf.call(callId, method, args) -> Promise<any>
    window.__koodoPdfHost.onResult(callId, payload, error)
    window.__koodoPdfHost.onEvent(name, payload)
    window.__koodoPdfHost.onLog(level, message)

  The page renders nothing itself: pages are rasterised into a detached canvas
  and drawn by Compose (see `PdfHostBridge.renderPage`). There is therefore no
  `<link rel="stylesheet">` and no `#stage` — the previous revision loaded a
  `pdf_viewer.css` that is not shipped in `assets/pdfengine/`.

  pdf.js (Apache-2.0, Mozilla) is imported as an ES module from ./pdf.mjs; the
  worker and cmaps are resolved relative to this file.
-->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Koodo PDF Engine</title>
</head>
<body>
<script type="module">
import { createPdfEngine, dispatch } from './engine.mjs';

const pdfjsLib = await import('./pdf.mjs');
pdfjsLib.GlobalWorkerOptions.workerSrc =
    new URL('./pdf.worker.mjs', import.meta.url).toString();

const host = window.__koodoPdfHost || {
    onResult: function () {},
    onEvent: function () {},
    onLog: function (level, message) { console.log(level + ': ' + message); },
};

function log(level, message) {
    try { host.onLog(level, String(message)); } catch (e) {}
    if (level === 'error') console.error(message); else console.log(message);
}

const engine = createPdfEngine({
    pdfjsLib,
    log,
    cMapUrl: new URL('./cmaps/', import.meta.url).toString(),
});

window.__koodoPdf = {
    call(callId, method, args) {
        return dispatch(engine, callId, method, args || [], host);
    },
};

// Readiness signal: PdfJsHostBridge logs it, and it makes first-boot
// debugging (chrome://inspect) not a black box.
log('info', 'pdfengine ready');
window.__koodoPdfReady = true;
try { host.onEvent('ready', '{}'); } catch (e) {}
</script>
</body>
</html>
