plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystoreProp = (project.findProperty("keystore") ?: "").toString().trim()
def storePass = (project.findProperty("storePassword") ?: "").toString()
def aliasProp = (project.findProperty("keyAlias") ?: "").toString()
def keyPass = (project.findProperty("keyPassword") ?: "").toString()
if (keyPass.length() == 0) {
    keyPass = storePass
}
def hasKeystore = keystoreProp.length() > 0

// Dual-track switch (docs/android-native-migration.md §2.1): build-android.js
// passes `-Ptarget=webview|native`. The native track launches the Compose shell
// (shell/NativeShellActivity); the webview track keeps the WebView host.
def buildTarget = (project.findProperty("target") ?: "webview").toString().trim()
def nativeShell = buildTarget == "native"

// P8 size work — both switches are OPT-IN so nothing changes by default.
// See docs/p8-rollout-checklist.md §3 and docs/android-baseline-after.json.
//   -PsplitAbi=true    ABI splits. Kept opt-in because the per-ABI builds driven
//                      by scripts/build-android.js (-PabiFilters) already cover
//                      Play/CI delivery, and the two mechanisms must not overlap.
//   -PstripIsland=true Do not package the staged fallback island
//                      (src/main/assets/webapp) into the APK. Gated on purpose:
//                      MainActivity's VIEW/SEND intent filters still point at the
//                      island, so the intent routing migration
//                      (docs/p8-rollout-checklist.md §2 step 3) must land first.
def splitAbi = (project.findProperty("splitAbi") ?: "false").toString().trim() == "true"
def stripIsland = (project.findProperty("stripIsland") ?: "false").toString().trim() == "true"
def hasAbiFilters = project.hasProperty("abiFilters")

android {
    namespace 'com.koodoreader.reader'
    compileSdk 34

    defaultConfig {
        applicationId "com.koodoreader.reader"
        minSdk 24
        targetSdk 34
        versionCode Math.max(1, Integer.parseInt((project.findProperty("versionCode") ?: "1").toString()))
        versionName (project.findProperty("versionName") ?: "0.0.0").toString()

        // Launcher activity-alias target (see AndroidManifest.xml).
        manifestPlaceholders = [
            nativeLauncher: nativeShell ? ".shell.NativeShellActivity" : ".MainActivity",
        ]
        buildConfigField "boolean", "NATIVE_SHELL", nativeShell.toString()

        // Restrict the APK to a single ABI when building per-ABI splits
        // (driven by `-PabiFilters=<abi>` from scripts/build-android.js).
        // `abiFilters` resolves to the NdkOptions property (HashSet) when written
        // as a bare expression (Groovy then looks for a `*` operator), so use the
        // explicit call form with a splat to hit the varargs method abiFilters(String...).
        if (project.hasProperty("abiFilters")) {
            def abis = project.property("abiFilters").toString().split(",").collect { it.trim() }
            ndk {
                try {
                    abiFilters(*abis)
                } catch (Exception ignoreAbiMethodMismatch) {
                    // AGP/Gradle DSL drift fallback: assign the settable property.
                    abiFilters = abis
                }
            }
        }
    }

    // P8: ABI splits (opt-in, see -PsplitAbi above).
    // NOTE — measured on the current debug APK: it contains ZERO .so files
    // (docs/android-baseline-after.json), so splits buy nothing today. They are
    // declared here so that whichever native library lands next (ML Kit, an NDK
    // codec) is split automatically instead of re-opening the build script.
    if (splitAbi && !hasAbiFilters) {
        splits {
            abi {
                enable true
                reset()
                include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
                universalApk false
            }
        }
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystoreProp)
                storePassword storePass
                keyAlias aliasProp
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }

        // P8 Macrobenchmark (android/benchmarks): a release-shaped, non-debuggable,
        // debug-signed variant. Macrobenchmark refuses to measure a debuggable app,
        // and `release` is not locally installable without a keystore — this variant
        // is both. Kept out of the shipped matrix (never referenced by
        // scripts/build-android.js).
        benchmark {
            initWith release
            debuggable false
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    composeOptions {
        // Compose compiler compatible with Kotlin 1.9.24.
        kotlinCompilerExtensionVersion '1.5.14'
    }

    // P8 fallback-island decommission (opt-in, see -PstripIsland above).
    // scripts/build-android.js stages the web build into src/main/assets/webapp
    // for the webview target and leaves it on disk (the directory is gitignored),
    // so a native-only build otherwise packages the island too — measured at
    // 21.11 MB raw / 7.78 MB compressed of the current APK.
    if (stripIsland) {
        androidResources {
            // aapt2 --ignore-assets: the platform default list + the staged web app.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:webapp'
        }
    }
}

dependencies {
    // WebView track: the bundled web build under assets/webapp.
    // Native track: Compose shell + Room data layer + import rules.
    implementation project(':core:data')
    implementation project(':core:importer')
    implementation project(':core:dbio')
    implementation project(':core:common')

    // Compose design system for the shell (android UI/UX sub-project ①). Brings
    // the token values (:core:designsystem, re-exported via `api`) and the shared
    // component primitives. Exposes no :core:data on purpose.
    implementation project(':core:ui')
    implementation project(':engine:cfi')
    implementation project(':engine:layout')
    implementation project(':engine:gesture')
    // Native PDF reading core (P3, docs/android-native-migration.md §6):
    // pdf.js in the engine WebView, Apache-2.0, zero .so.
    implementation project(':engine:pdf')

    // P8 crash monitoring core (android/feature/crash): pure JVM, no backend
    // dependency. The Sentry / Firebase Crashlytics adapter is opt-in — see
    // CrashBackends.kt and docs/p8-rollout-checklist.md §4.
    implementation project(':feature:crash')

    // ---------------------------------------------------------------------
    // P2 / P5 / P6 modules integrated from their worktrees. Registering them on
    // the :app classpath is the "wiring" half of the merge; each module's
    // *host* integration (reader screens, services, manifest entries) is tracked
    // separately in docs/BOARD-2026-09-24.html.
    // ---------------------------------------------------------------------

    // P2 reading-engine decision layers (highlights/notes/bookmarks, links and
    // footnotes, TOC/progress/search).
    implementation project(':engine:annotate')
    implementation project(':engine:link')
    implementation project(':engine:toc')

    // P5 native text (TXT/MD) + P4 MOBI parser: consumed by the native reader
    // host (epubhost sessions) so EPUB/TXT/MD/MOBI share one pagination screen.
    implementation project(':engine:text')
    implementation project(':engine:mobi')

    // P5.5b/c single-file HTML/XHTML/XML + MHTML producers (ADR-006).
    implementation project(':engine:htmlbook')

    // P5.5a/d FB2 (FictionBook 2) + DOCX (WordprocessingML subset) producers.
    implementation project(':engine:fb2')
    implementation project(':engine:docx')

    // P5 native comic / image-sequence reader (CBZ / CBT / image directory).
    implementation project(':engine:image')

    // P6 simplified/traditional conversion + on-demand locale packs. :app binds
    // ZhConvertSettingsStore to DataStore (docs/p6-zh-locale-design.md §4.1).
    implementation project(':core:locale')

    // P6 statistics screen + reading-time accounting.
    implementation project(':feature:stats')

    // P6 on-device OCR. Still needs the `com.google.mlkit.vision.DEPENDENCIES`
    // manifest meta-data before the models pre-download at install time
    // (docs/p6-stats-ocr-design.md §5).
    implementation project(':feature:ocr')

    // P6 TTS. The manifest entries the foreground service / media-button
    // receiver need are still pending — see the P6-TTS-WIRE item on the board
    // and docs/p6-tts-semantics-mapping.md §5.
    implementation project(':feature:tts')

    // P6 selection translation / AI assistant.
    implementation project(':feature:translate')

    // P6 native MDX/MDD dictionary.
    implementation project(':feature:dictionary')

    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    // FileProvider (P3 PDF page share) lives in androidx.core; declare it
    // explicitly rather than relying on the activity-compose transitive edge.
    implementation 'androidx.core:core-ktx:1.13.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Local JVM unit tests (pure logic, e.g. LibraryLogicTest).
    // JUnit 5 platform + vintage: existing junit4 tests keep running while
    // new tests (EPUB reader host) use jupiter — both on testDebugUnitTest.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // `runBlocking` for the suspend import pipeline (import → read E2E test).
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.1'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}
