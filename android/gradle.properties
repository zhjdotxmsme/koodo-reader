# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX (required by modern Android Gradle Plugin projects).
android.useAndroidX=true

# Do not generate transitive R classes (faster builds, smaller R).
android.nonTransitiveRClass=true

# Kotlin style.
kotlin.code.style=official

# Parallel + cache for faster CI builds.
org.gradle.parallel=true
org.gradle.caching=true

# Local dev: set in ~/.gradle/gradle.properties (machine-specific, do NOT commit)
#   org.gradle.java.installations.paths=<path-to-local-JDK-17>
# On CI this is handled by actions/setup-java; auto-detection finds the JDK it installs.
