// feature/ocr — native OCR (P6): ML Kit on-device text recognition with
// ON-DEMAND model packs + a searchable index of scanned pages.
//
// Layout of the module (same convention as :feature:stats):
//   src/main/kotlin/.../ocr/*.kt           pure Kotlin: script→model mapping,
//                                          text normaliser, the on-demand
//                                          download contract, the OCR index +
//                                          search loop, Room entity/DAO.
//   src/main/kotlin/.../ocr/platform/*.kt  ML Kit engine, Play services module
//                                          downloader, Room database.
//
// Dependency choice — ON-DEMAND (Play services) instead of BUNDLED:
//   unbundled : com.google.android.gms:play-services-mlkit-text-recognition*
//               model downloaded via Google Play services, ≈260 KB per script
//               per ABI, ZERO ML Kit .so in our APK.
//   bundled   : com.google.mlkit:text-recognition*  (≈4 MB per script per ABI,
//               model + native libs inside the APK → 16 KB page-size risk).
// Switch by replacing the five `play-services-mlkit-*` lines below with their
// `com.google.mlkit:*` counterparts — the Kotlin API is identical. See
// docs/p6-stats-ocr-design.md §5 (16 KB / .so analysis) before switching.
//
// Wiring (main thread): `include ':feature:ocr'` in android/settings.gradle +
// `implementation project(':feature:ocr')` in :app, and the manifest meta-data
//
//   <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES"
//              android:value="ocr,ocr_chinese" />
//
// (value built by `OcrScript.manifestValue(listOf(...))`) to pre-download the
// models at install time.
//
// ---------------------------------------------------------------------------
// RESOLVED (2026-09-24, user decision: stay on the Play-services artifacts):
// `platform/MlKitModelDownloader.kt` used to be excluded from the build because
// the Play-services module-install API needs an `OptionalModuleApi`, which ML
// Kit's text-recognition options are not (javap evidence below). It is now
// implemented as a probe instead — see the file header — and both previously
// quarantined files are compiled again (no `exclude` block any more).
//
// The API that could not be bridged:
//   $ javap -classpath play-services-mlkit-text-recognition-19.0.1/classes.jar \
//       com.google.mlkit.vision.text.latin.TextRecognizerOptions
//   public class ...TextRecognizerOptions
//       implements com.google.mlkit.vision.text.TextRecognizerOptionsInterface
//   $ javap ... com.google.mlkit.vision.text.TextRecognizerOptionsInterface
//   public interface ...TextRecognizerOptionsInterface {   // no OptionalModuleApi
//     getModuleId(); getOptionalFeatures() is NOT declared
//   }
//
// Consequence the UI must live with: `DownloadState.Downloading` carries
// `progress = null` (ML Kit exposes no byte counts for these models) and
// `release()` returns false (the packs belong to Google Play services).
//
// Install-time pre-download is driven by the app manifest meta-data
// `<meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" .../>`
// (`OcrScript.manifestValue(listOf(...))` builds the value); whatever is still
// missing is fetched by ML Kit on first use.
// ---------------------------------------------------------------------------
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.koodoreader.feature.ocr'
    compileSdk 34


    defaultConfig {
        minSdk 24 // ML Kit text recognition v2 requires API 23+
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // ML Kit text recognition v2, Play-services (unbundled) artifacts.
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-japanese:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-korean:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-devanagari:16.0.1'
    // No play-services-base / ModuleInstallClient any more: the module-install
    // API cannot address ML Kit's options objects (see the RESOLVED note above).
    // The models are still Play-services modules — the manifest DEPENDENCIES
    // meta-data plus ML Kit's own first-use fetch is what installs them.
    // Optional: only needed if the OCR feature is later split into an on-demand
    // dynamic feature module (then add this to the BASE module instead):
    // implementation 'com.google.mlkit:playstore-dynamic-feature-support:16.0.0-beta2'

    def roomVersion = '2.6.1'
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    // Local JVM unit tests for the pure core (ocr/*.kt).
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.1'
}
